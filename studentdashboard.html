<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="static/css/admindashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>
<div class="dashboard-container">
    <aside class="sidebar-container">
        <nav class="navbar">
            <div class="logo">
                <img src="/static/img/logo.webpg" alt="logo">
                <p>Brightstone College LMS</p>
            </div>
            <ul>
                <li><a href="#home"><i class="fa-solid fa-house"></i>   Home</a></li>
                <li><a href="/logout"><i class="fa-solid fa-sign-out-alt"></i>  Logout</a></li>
            </ul>
        </nav>
    </aside>

    <div id="home" class="main-content">

        <div class="header">
            <p>Today is: <time id="autodate"></time></p>
        </div> 
        <section class="welcome-content">
            <h1>Welcome back, {{firstname}}!</h1>
            <h2>Role: {{role}}</h2>
        </section>
    </div>    
</div>

<script src="static/js/admindashboard.js"></script>

</body>

</html>

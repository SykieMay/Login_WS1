<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="static/css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"></head>
<body>
    <div class="login-container" >
        <section class="class logo">
            <img src="/static/img/logo.webpg" alt="logo">
        </section>
        <h1>Brightstone College LMS</h1>
        <p>Please login your account.</p>
        <form action="/login" method="POST">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required><br>
            <label for="password">Password:</label>
            <div class="password-container">
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
                <i class="fa-solid fa-eye toggle-password" id="eye"></i><br>
            </div>
            <div class="remember">
                <input type="checkbox" id="remember" name="remember">
                <label for="remember"> Remember me</label>
            </div>
            <div class="forgot-password">
                <a href="/register.html">Forgot Password?</a>
            </div>
            <button type="submit" href="/login">Login</button>
            <div class="register">
                <p>Don't have an account? <a href="register.html">Sign up</a></p>
            </div>
        </form>
    </div>
    <script src="/static/js/login.js"></script>
</body>
</html>
